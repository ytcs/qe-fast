name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: git ls-files 'qefast/*.sh' | xargs -n1 bash -n
      - name: Python syntax
        run: git ls-files 'qefast/*.py' | xargs python3 -m py_compile
      - name: The old project name stays out
        run: |
          # The name is split so that this file does not match itself; "Bertsch" is a vendored copyright line.
          if git grep -nIi 'rt''sc' | grep -v 'Bertsch'; then
            echo "::error::old project name found"
            exit 1
          fi
      - name: Sources carry a licence tag
        run: |
          missing=$(git ls-files 'qefast/*.sh' 'qefast/*.py' 'qefast/*.f90' 'qefast/*.cu' 'qefast/*.c' \
            | xargs grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then echo "$missing"; echo "::error::missing SPDX tag"; exit 1; fi

  cpu-build:
    runs-on: ubuntu-24.04
    # build about 25 min; the five test-suite cases take 7.7 min serial on a desktop CPU
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran ninja-build libopenblas-dev libfftw3-dev
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQE_ENABLE_MPI=OFF -DQE_ENABLE_TEST=OFF \
            -DQE_FFTW_VENDOR=FFTW3
      - name: Build
        # Every executable the test cases below call; all build without CUDA.
        run: |
          cmake --build build -j 4 --target pw.x ph.x epw.x q2r.x matdyn.x hp.x \
            turbo_eels.x turbo_spectrum.x
      - name: Small pw.x test
        env:
          ESPRESSO_PSEUDO: ${{ github.workspace }}/EPW/examples/sic/pp   # holds Si.pz-vbc.UPF, so no download
          OMP_NUM_THREADS: 1
        run: |
          pw="$PWD/build/bin/pw.x"
          ref=$(awk '/^!    total energy/ {print $5}' test-suite/pw_scf/benchmark.out.git.inp=scf.in)
          mkdir ci-run && cd ci-run
          cp ../test-suite/pw_scf/scf.in .
          for preset in "" off; do
            ESPRESSO_TMPDIR=tmp QEF_PRESET=$preset "$pw" -in scf.in > "scf-$preset.out" \
              || { tail -n 20 "scf-$preset.out"; exit 1; }
            grep -q 'JOB DONE' "scf-$preset.out"
            grep -E 'qe-fast( preset)?: ' "scf-$preset.out"
            e=$(awk '/^!    total energy/ {print $5}' "scf-$preset.out")
            echo "preset '$preset': $e Ry, reference $ref Ry"
            awk -v a="$e" -v b="$ref" 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(d < 1e-5) }'
          done
          if QEF_PRESET=bogus "$pw" -in scf.in > bogus.out 2>&1; then
            echo "::error::an invalid QEF_PRESET did not stop the run"
            exit 1
          fi
      - name: Test-suite cases against upstream benchmarks (default preset)
        # One case per executable family, serial. Each also passes on vanilla QE 7.6 built the same way.
        env:
          OMP_NUM_THREADS: 1
        run: |
          ln -s build/bin bin
          cd test-suite
          fail=0
          for t in pw_scf ph_base epw_base tddfpt_eels-si hp_insulator_us; do
            start=$SECONDS
            if ! make run-custom-test testdir=$t > "../ts-$t.log" 2>&1 \
               || grep -qE '\*\*FAILED|SKIPPED' "../ts-$t.log" || ! grep -q ': Passed' "../ts-$t.log"; then
              tail -n 40 "../ts-$t.log"; echo "::error::test-suite case $t failed"; fail=1
            fi
            echo "$t: $(grep -c ': Passed' "../ts-$t.log") passed in $((SECONDS - start)) s"
          done
          exit $fail
